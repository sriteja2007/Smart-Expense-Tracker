<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F111A" />
      <stop offset="100%" stop-color="#07080C" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8B5CF6" flood-opacity="0.45" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  <!-- Center Card / Wallet Emblem -->
  <g filter="url(#shadow)">
    <rect x="116" y="146" width="280" height="220" rx="36" fill="url(#brand)" />
    <path d="M116 210 H396" stroke="rgba(255,255,255,0.2)" stroke-width="3" />
    <circle cx="330" cy="275" r="28" fill="#0F111A" opacity="0.6" />
    <circle cx="330" cy="275" r="14" fill="url(#glow)" />
    <!-- Stylized L / Spark -->
    <path d="M166 230 L166 310 L230 310" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
